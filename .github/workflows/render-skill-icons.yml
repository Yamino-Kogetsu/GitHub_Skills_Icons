name: Render Skills Icons

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      icons:
        description: 'Comma or space separated icon keys'
        required: false
        default: ''
      align:
        description: 'left, center, or right'
        required: false
        default: 'center'
      theme:
        description: 'auto, dark, or light'
        required: false
        default: 'auto'
      perLine:
        description: 'Icons per row'
        required: false
        default: '6'
      gapX:
        description: 'Horizontal gap'
        required: false
        default: '24'
      gapY:
        description: 'Vertical gap'
        required: false
        default: '24'
      marginX:
        description: 'Horizontal margin'
        required: false
        default: '24'
      marginY:
        description: 'Vertical margin'
        required: false
        default: '24'
      iconSize:
        description: 'Icon size'
        required: false
        default: '64'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build manifest
        run: npm run build

      - name: Export workflow inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "ICON=${{ inputs.icons }}" >> "$GITHUB_ENV"
          echo "ALIGN=${{ inputs.align }}" >> "$GITHUB_ENV"
          echo "THEME=${{ inputs.theme }}" >> "$GITHUB_ENV"
          echo "PER_LINE=${{ inputs.perLine }}" >> "$GITHUB_ENV"
          echo "GAP_X=${{ inputs.gapX }}" >> "$GITHUB_ENV"
          echo "GAP_Y=${{ inputs.gapY }}" >> "$GITHUB_ENV"
          echo "MARGIN_X=${{ inputs.marginX }}" >> "$GITHUB_ENV"
          echo "MARGIN_Y=${{ inputs.marginY }}" >> "$GITHUB_ENV"
          echo "ICON_SIZE=${{ inputs.iconSize }}" >> "$GITHUB_ENV"

      - name: Render SVG
        run: npm run render

      - name: Commit rendered assets
        shell: bash
        run: |
          if git diff --quiet -- dist/; then
            echo "No changes in dist/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: render skill icons v6"
          git push
